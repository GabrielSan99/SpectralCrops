{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Testes — SpectralCrops</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117; color: #e0e0e0;
      min-height: 100vh; padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.3rem; font-weight: 400; letter-spacing: 0.15em;
      text-transform: uppercase; color: #888; text-align: center;
      margin-bottom: 1.8rem;
    }
    h2 {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: #6a7080; margin-bottom: 1.2rem;
    }
    .grid {
      display: grid; gap: 1.5rem; max-width: 1100px; margin: 0 auto;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      align-items: start;
    }
    .card {
      background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 16px;
      padding: 1.6rem 1.7rem;
    }
    button {
      background: #12151e; color: #e0e0e0; border: 1px solid #2a2d3a;
      border-radius: 8px; padding: 8px 14px; font-size: 0.8rem;
      cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
      user-select: none;
    }
    button:hover { background: #1e2235; border-color: #4f8ef7; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── LEDs ── */
    .led-row {
      display: grid; grid-template-columns: 14px 62px 54px 1fr 40px 22px;
      align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .led-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #2a2d3a; border: 1px solid #333; transition: all .2s;
    }
    .led-row.on .led-dot {
      background: var(--c); border-color: var(--c);
      box-shadow: 0 0 8px var(--c);
    }
    .led-name { font-size: 0.85rem; color: #cfd3dc; font-variant-numeric: tabular-nums; }
    .led-toggle { padding: 5px 0; font-size: 0.72rem; text-align: center; }
    .led-row.on .led-toggle { border-color: var(--c); color: #fff; }
    .led-slider { width: 100%; accent-color: #4f8ef7; }
    .led-pct { font-size: 0.72rem; color: #666; text-align: right;
               font-variant-numeric: tabular-nums; }
    .led-timer { font-size: 0.78rem; font-weight: 700; color: #f5c518;
                 text-align: center; font-variant-numeric: tabular-nums; }
    .leds-footer { margin-top: 1rem; display: flex; justify-content: flex-end; }

    /* ── Camera ── */
    .stream-wrap {
      background: #0b0d13; border: 1px solid #2a2d3a; border-radius: 10px;
      aspect-ratio: 16 / 10; display: flex; align-items: center;
      justify-content: center; overflow: hidden; margin-bottom: 1rem;
    }
    .stream-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .stream-wrap .placeholder { color: #444; font-size: 0.8rem; }
    .cam-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .log { margin-top: 0.9rem; font-size: 0.72rem; color: #5a6070;
           min-height: 1.1em; letter-spacing: 0.03em; }

    /* ── Motor (do motor_web) ── */
    .motor-body { display: flex; flex-direction: column; align-items: center; gap: 1.6rem; }
    .dial-wrap { position: relative; width: 150px; height: 150px; }
    #dial-svg  { width: 150px; height: 150px; transform: rotate(-90deg); }
    .dial-track { fill: none; stroke: #2a2d3a; stroke-width: 8; }
    .dial-arc   { fill: none; stroke: #4f8ef7; stroke-width: 8;
                  stroke-linecap: round; transition: stroke-dashoffset .35s ease; }
    .dial-label { position: absolute; inset: 0; display: flex;
                  flex-direction: column; align-items: center; justify-content: center; }
    .dial-label span:first-child { font-size: 1.8rem; font-weight: 600; color: #fff; line-height: 1; }
    .dial-label span:last-child  { font-size: 0.7rem; color: #555; letter-spacing: 0.1em; }
    .motor-btns { display: flex; gap: 1rem; }
    .motor-btns button {
      width: 96px; height: 96px; border-radius: 50%; border-width: 2px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px; font-size: 0.72rem;
    }
    .motor-btns svg { width: 26px; height: 26px; stroke: #4f8ef7; fill: none;
                      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .limit-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .limit-label { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: #555; }
    .led-wrap { display: flex; align-items: center; gap: 10px; }
    #led-svg .led-body  { fill: #1a0000; transition: fill .2s; }
    #led-svg .led-glow  { fill: none; opacity: 0; transition: opacity .2s; }
    #led-svg .led-shine { fill: rgba(255,255,255,0.15); }
    #led-svg .led-base  { fill: #2a2d3a; }
    #led-svg .led-legs  { stroke: #444; fill: none; stroke-width: 1.5; }
    #led-svg.on .led-body { fill: #ff2222; filter: drop-shadow(0 0 6px #ff0000); }
    #led-svg.on .led-glow { opacity: 1; }
    .led-status { font-size: 0.8rem; font-weight: 600; color: #333; transition: color .2s; }
    .led-status.on { color: #ff4444; }
    #btn-reset { font-size: 0.72rem; color: #777; }
  </style>
</head>
<body>

<h1>Painel de Testes — SpectralCrops</h1>

<div class="grid">

  <!-- ══ LEDs ══ -->
  <div class="card">
    <h2>LEDs — 8 bandas</h2>
    {% for b in bands %}
    <div class="led-row" data-nm="{{ b.nm }}" style="--c: {{ b.color }}">
      <span class="led-dot"></span>
      <span class="led-name">{{ b.nm }} nm</span>
      <button class="led-toggle" onclick="toggleLed('{{ b.nm }}')">OFF</button>
      <input class="led-slider" type="range" min="0" max="255" value="0"
             oninput="onSlider('{{ b.nm }}', this.value)">
      <span class="led-pct">0%</span>
      <span class="led-timer"></span>
    </div>
    {% endfor %}
    <div class="leds-footer">
      <button onclick="ledsOff()">Apagar todos</button>
    </div>
  </div>

  <!-- ══ Camera ══ -->
  <div class="card">
    <h2>Câmera</h2>
    <div class="stream-wrap">
      <img id="stream" alt="Camera Stream" data-src="{% url 'video_feed' %}">
      <span class="placeholder" id="stream-ph">stream desligado</span>
    </div>
    <div class="cam-controls">
      <button id="streamBtn" onclick="toggleStream()">Start Stream</button>
      <button onclick="getFrame()">Get Frame</button>
      <button id="allBandsBtn" onclick="getAllBands()">Get All Bands</button>
    </div>
    <p class="log" id="cam-log">Pronto.</p>
  </div>

  <!-- ══ Motor ══ -->
  <div class="card">
    <h2>Motor de passo</h2>
    <div class="motor-body">
      <div class="dial-wrap">
        <svg id="dial-svg" viewBox="0 0 160 160">
          <circle class="dial-track" cx="80" cy="80" r="66"/>
          <circle class="dial-arc" cx="80" cy="80" r="66" id="arc"
                  stroke-dasharray="414.69" stroke-dashoffset="414.69"/>
        </svg>
        <div class="dial-label"><span id="pos-deg">0.0</span><span>graus</span></div>
      </div>

      <div class="motor-btns">
        <button id="btn-ccw" onclick="moveMotor('ccw')">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Anti-horário
        </button>
        <button id="btn-cw" onclick="moveMotor('cw')">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          Horário
        </button>
      </div>

      <div class="limit-section">
        <span class="limit-label">Limit Switch</span>
        <div class="led-wrap">
          <svg id="led-svg" width="36" height="58" viewBox="0 0 40 64">
            <g class="led-legs"><line x1="14" y1="52" x2="10" y2="64"/><line x1="26" y1="52" x2="30" y2="64"/></g>
            <rect class="led-base" x="8" y="44" width="24" height="10" rx="3"/>
            <ellipse class="led-body" cx="20" cy="30" rx="17" ry="17"/>
            <ellipse class="led-glow" cx="20" cy="30" rx="17" ry="17" style="fill:#ff4444; filter:blur(4px);"/>
            <ellipse class="led-shine" cx="14" cy="22" rx="5" ry="3" transform="rotate(-30 14 22)"/>
          </svg>
          <span class="led-status" id="led-status">Livre</span>
        </div>
      </div>

      <button id="btn-reset" onclick="resetMotor()">Zerar posição</button>
    </div>
  </div>

</div>

<script>
const CSRF = '{{ csrf_token }}';
const URLS = {
  status:      "{% url 'tests_status' %}",
  led:         "{% url 'tests_led' %}",
  ledsOff:     "{% url 'tests_leds_off' %}",
  motor:       "{% url 'tests_motor' %}",
  motorReset:  "{% url 'tests_motor_reset' %}",
  capture:     "{% url 'tests_capture' %}",
};

function api(url, data) {
  return fetch(url, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF },
    body: new URLSearchParams(data || {}),
  }).then(r => r.json());
}
function getJSON(url) { return fetch(url).then(r => r.json()); }
function camLog(msg) { document.getElementById('cam-log').textContent = msg; }

/* ── LEDs (brilho PWM) + contador de auto-desligamento (amarelo) ── */
const COUNTDOWN_START = 5;   // segundos; ajuste aqui se quiser outro tempo
const timers = {};           // banda -> id do setInterval
const editing = {};          // banda -> timestamp da ultima edicao do slider

function timerEl(nm) {
  const row = document.querySelector(`.led-row[data-nm="${nm}"]`);
  return row ? row.querySelector('.led-timer') : null;
}
function clearCountdown(nm) {
  if (timers[nm]) { clearInterval(timers[nm]); delete timers[nm]; }
  const el = timerEl(nm); if (el) el.textContent = '';
}
function startCountdown(nm) {
  clearCountdown(nm);
  const el = timerEl(nm); if (!el) return;
  let remaining = COUNTDOWN_START;
  el.textContent = remaining;
  timers[nm] = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearCountdown(nm);
      // chegou a zero -> desliga o LED
      api(URLS.led, { band: nm, brightness: 0 }).then(() => applyLedState(nm, 0));
    } else {
      el.textContent = remaining;
    }
  }, 1000);
}

function applyLedState(nm, dc) {
  const row = document.querySelector(`.led-row[data-nm="${nm}"]`);
  if (!row) return;
  const on = dc > 0;
  row.classList.toggle('on', on);
  row.querySelector('.led-toggle').textContent = on ? 'ON' : 'OFF';
  row.querySelector('.led-pct').textContent = Math.round(dc / 255 * 100) + '%';
  if (!on) clearCountdown(nm);  // apagou (aqui ou no servidor) -> some o contador
  // so mexe no slider se o usuario nao estiver arrastando ele agora
  if (!editing[nm] || Date.now() - editing[nm] > 1200) {
    row.querySelector('.led-slider').value = dc;
  }
}
function toggleLed(nm) {
  api(URLS.led, { band: nm, action: 'toggle' }).then(d => {
    applyLedState(nm, d.dc);
    if (d.dc > 0) startCountdown(nm);  // ligou -> inicia contador
  });
}
let sliderTimer = {};
function onSlider(nm, val) {
  editing[nm] = Date.now();
  val = Number(val);
  const row = document.querySelector(`.led-row[data-nm="${nm}"]`);
  row.classList.toggle('on', val > 0);
  row.querySelector('.led-pct').textContent = Math.round(val / 255 * 100) + '%';
  row.querySelector('.led-toggle').textContent = val > 0 ? 'ON' : 'OFF';
  clearTimeout(sliderTimer[nm]);
  sliderTimer[nm] = setTimeout(() => {
    api(URLS.led, { band: nm, brightness: val });
    if (val > 0) startCountdown(nm); else clearCountdown(nm);  // reinicia/zera contador
  }, 60);
}
function ledsOff() {
  api(URLS.ledsOff).then(() => {
    document.querySelectorAll('.led-row').forEach(r => applyLedState(r.dataset.nm, 0));
  });
}

/* ── Motor ── */
const ARC_CIRC = 414.69;
function updateDial(deg) {
  document.getElementById('pos-deg').textContent = parseFloat(deg).toFixed(1);
  const norm = ((deg % 360) + 360) % 360;
  document.getElementById('arc').style.strokeDashoffset = ARC_CIRC - (norm / 360) * ARC_CIRC;
}
function updateLimit(t) {
  const svg = document.getElementById('led-svg');
  const st = document.getElementById('led-status');
  svg.classList.toggle('on', t); st.classList.toggle('on', t);
  st.textContent = t ? 'Acionado!' : 'Livre';
}
function setMotorBusy(b) {
  document.getElementById('btn-cw').disabled = b;
  document.getElementById('btn-ccw').disabled = b;
}
function moveMotor(dir) {
  setMotorBusy(true);
  api(URLS.motor, { dir }).then(d => { updateDial(d.pos); updateLimit(d.limit); })
    .finally(() => setMotorBusy(false));
}
function resetMotor() {
  api(URLS.motorReset).then(d => updateDial(d.pos));
}

/* ── Stream ── */
function isStreaming() { return !!document.getElementById('stream').getAttribute('src'); }
function streamOn() {
  const img = document.getElementById('stream');
  img.src = img.dataset.src + '?t=' + Date.now();
  img.style.display = 'block';
  document.getElementById('stream-ph').style.display = 'none';
  document.getElementById('streamBtn').textContent = 'Stop Stream';
}
function streamOff() {
  const img = document.getElementById('stream');
  img.removeAttribute('src'); img.style.display = 'none';
  document.getElementById('stream-ph').style.display = 'block';
  document.getElementById('streamBtn').textContent = 'Start Stream';
}
function toggleStream() { isStreaming() ? streamOff() : streamOn(); }

/* ── Capturas ── */
function getFrame() {
  camLog('Capturando frame...');
  api(URLS.capture, { action: 'get_frame' })
    .then(() => camLog('Frame salvo em captures_test/'))
    .catch(e => camLog('Erro: ' + e));
}
async function getAllBands() {
  const btn = document.getElementById('allBandsBtn');
  const wasStreaming = isStreaming();
  if (wasStreaming) streamOff();       // libera a camera durante a captura
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Capturando...';
  camLog('Capturando as 8 bandas...');
  try {
    const d = await api(URLS.capture, { action: 'get_all_bands' });
    camLog('8 bandas salvas em captures_test/' + (d.folder || ''));
  } catch (e) {
    camLog('Erro na captura: ' + e);
  } finally {
    btn.disabled = false; btn.textContent = original;
    if (wasStreaming) streamOn();
  }
}

/* ── Polling ── */
function poll() {
  getJSON(URLS.status).then(d => {
    for (const nm in d.leds) applyLedState(nm, d.leds[nm]);
    updateDial(d.motor.pos); updateLimit(d.motor.limit);
  }).catch(() => {}).finally(() => setTimeout(poll, 500));
}
streamOff();
poll();
</script>

</body>
</html>
