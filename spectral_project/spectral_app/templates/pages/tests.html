{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/SpectralCrops-figure.png' %}">
    <link rel="stylesheet" href="{% static 'css/tests_styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <title>Document</title>
</head>
<body>
    <div class="forms-div">
        <h1>Controle de Ações</h1>
        <form method="post">
            {% csrf_token %}
            <button type="submit" name="action" value="get_frame">Get Frame</button>
            <button type="submit" name="action" value="white_led">White</button>
            <button type="submit" name="action" value="yellow_led">Yellow</button>
            <button type="submit" name="action" value="red_led">Red</button>
            <button type="submit" name="action" value="blue_led">Blue</button>
            <button type="submit" name="action" value="turn_off">Turn Off Leds</button>
            <button type="submit" name="action" value="get_all_bands">Get All Bands</button>
        </form>
    </div>
    <div class="stream-div">
        <!-- <img src="{% url 'video_feed' %}" class="img-fluid" alt="Camera Stream" /> -->
    </div>
    <div class="canvas-div">
        <canvas id="canvas"></canvas>
    </div>
    <div class="btns-div">
        <button id="extractBtn">Extract Selection</button>
        <button id="segmentBtn">Segment Selection</button>
    </div>
    <div class="results-div">
        <img id="extracResult">
    </div>
        




<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const img = new Image();
img.src = '/static/img/beans.png'; 
img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
};

let startX, startY, endX, endY, isDrawing = false;

canvas.addEventListener('mousedown', e => {
    startX = e.offsetX;
    startY = e.offsetY;
    isDrawing = true;
});

canvas.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    endX = e.offsetX;
    endY = e.offsetY;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, startY, endX - startX, endY - startY);
});

canvas.addEventListener('mouseup', e => {
    isDrawing = false;
});

document.getElementById('extractBtn').addEventListener('click', () => {
    const width = endX - startX;
    const height = endY - startY;
    if(width <= 0 || height <= 0) return alert("Seleção inválida!");

    const selectionCanvas = document.createElement('canvas');
    const selectionCtx = selectionCanvas.getContext('2d');
    selectionCanvas.width = width;
    selectionCanvas.height = height;

    selectionCtx.drawImage(img, startX, startY, width, height, 0, 0, width, height);
    const dataURL = selectionCanvas.toDataURL();

    document.getElementById('extracResult').src = dataURL;

    // Enviar para Django
    fetch('/img_extraction/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': '{{ csrf_token }}' },
        body: 'imagem=' + encodeURIComponent(dataURL), 
    }).then(res => res.json())
      .then(data => {
          if(data.status === "ok") alert("Salvo em: " + data.url);
      });
});
</script>
    

</body>
</html>
