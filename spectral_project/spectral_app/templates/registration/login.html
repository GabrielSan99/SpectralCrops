{% load static %}
<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/SpectralCrops-figure.png' %}">
    <link rel="stylesheet" href="{% static 'css/login_styles.css' %}">
    <title>SpectralCrops</title>
</head>

<script>
    const EYE_OPEN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_CLOSED_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function togglePassword() {
        const toggleButton = document.querySelector(".toggle-password");
        const passwordInput = toggleButton.previousElementSibling;

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleButton.innerHTML = EYE_CLOSED_ICON; // Ícone de esconder
        } else {
            passwordInput.type = "password";
            toggleButton.innerHTML = EYE_OPEN_ICON; // Ícone de ver
        }
    }
</script>

<body>
    <!-- Fundo animado -->
    <div class="wave"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>

    <!-- Card central -->

    <div class="login-container">
        <div class="logo-container">
            <img src="{% static 'img/spectral-crops.svg' %}" alt="">
        </div>      
        <div class="login-card">
            <h2>Login</h2>
            <form method="post">
                {% csrf_token %}
            <div class="form-group">
                {{ form.username.label_tag }}
                {{ form.username }}
                {% if form.username.errors %}
                    <div class="error">{{ form.username.errors }}</div>
                {% endif %}
            </div>

    <div class="form-group">
        {{ form.password.label_tag }}
        <div class="password-container">
            {{ form.password }}
            <button type="button" class="toggle-password" onclick="togglePassword()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        {% if form.password.errors %}
            <div class="error">{{ form.password.errors }}</div>
        {% endif %}
    </div>

    <button type="submit">Entrar</button>
            </form>
        </div>
    </div>


</body>
</html>
